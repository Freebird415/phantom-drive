[platformio]
; ⚠️ 关键：显式指定默认环境。否则定义了多个 env 时，
; `pio run -t upload`（含 VS Code 的上传按钮）会【把所有 env 都跑一遍】
; ⇒ uart_isp 没插 USB-TTL 就报 FAILED，把成功的 ST-Link 结果也带成"失败"。
; 备用通道仍可显式调用：pio run -d firmware -e uart_isp -t upload --upload-port COM5
default_envs = bluepill_f103c8

; P01 反馈链路 —— STM32F103C8T6 遥测 demo
;
; 常用命令（在仓库根目录执行）：
;   python tools/run.py --note "描述" --seconds 30     一键：编译+烧录+采集+出图
;   pio run -d firmware -t upload                      只编译+烧录
;   cd firmware && pio device monitor                  直接看串口输出（Ctrl+C 退出）

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = post:check_size.py
build_flags =
    ; 注意：**不要**再链 -Wl,-u,_printf_float / _scanf_float ——
    ; 本工程已不用 %f/%g 打印（改用 Bsp_FmtFix 定点输出），
    ; 链上它们会把 _dtoa_r + 双精度软浮点库（~6KB）一起拉进来。

; ---------------------------------------------------------------------------
; UART(ISP) 备用烧录通道 —— ST-Link 连不上/坏掉时用（2026-10-18）
;   1) BOOT0 跳线帽 -> 1，断电再上电
;   2) USB-TTL：TTL RXD <- 板 TX(PA9)、TTL TXD -> 板 RX(PA10)、GND 共地
;   3) pio run -d firmware -e uart_isp -t upload --upload-port COM5
;      （或 python tools/flash.py --uart COM5）
;   4) 烧完 BOOT0 -> 0，断电再上电
; ---------------------------------------------------------------------------
[env:uart_isp]
extends = env:bluepill_f103c8
upload_protocol = serial
upload_speed = 115200
